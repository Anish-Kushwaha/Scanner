name: Backend tests

on:
  push:
    branches: [main, android-production-ready]
    paths:
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python backend regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile api/index.py tests/test_scanner.py tests/check_frontend.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check inline frontend JavaScript
        run: python tests/check_frontend.py
