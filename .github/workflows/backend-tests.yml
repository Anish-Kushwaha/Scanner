name: Quality checks

on:
  push:
    branches: [main, rebuild-v1]
    paths: ["api/**", "tests/**", "*.html", "vercel.json", "requirements.txt", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["api/**", "tests/**", "*.html", "vercel.json", "requirements.txt", ".github/workflows/backend-tests.yml"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m py_compile api/index.py tests/test_scanner.py tests/check_frontend.py
      - name: Backend regression tests
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax and local references
        run: python tests/check_frontend.py
